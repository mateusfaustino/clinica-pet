<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf2">
  <meta name="description" content="Encontre clínicas veterinárias e petshops perto de você com a vetPerto.">
  <title>vetPerto — cuidado pertinho de você</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="vetPerto, início">
        <span class="brand-mark" aria-hidden="true">🐾</span>
        <span>vet<span>Perto</span></span>
      </a>
      <button class="avatar-button" type="button" aria-label="Abrir perfil de Marina">
        <span aria-hidden="true">👩🏽</span>
      </button>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Olá, Marina! <span aria-hidden="true">👋</span></p>
        <h1 id="page-title">Quem cuida do seu pet está <em>pertinho</em></h1>
        <p class="subtitle">Encontre o cuidado ideal sem ir longe.</p>

        <form class="search" role="search" id="search-form">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label class="sr-only" for="search-input">Buscar clínica, petshop ou serviço</label>
          <input id="search-input" type="search" placeholder="Clínica, petshop ou serviço..." autocomplete="off">
          <button type="submit" aria-label="Buscar">Buscar</button>
        </form>

        <div class="location-row">
          <span class="location-pin" aria-hidden="true">●</span>
          <span>Próximo a <strong>Aldeota, Fortaleza</strong></span>
          <button type="button" id="change-location">Alterar</button>
        </div>

        <div class="filters" aria-label="Filtrar resultados">
          <button class="filter active" type="button" data-filter="Todos" aria-pressed="true"><span aria-hidden="true">✨</span> Todos</button>
          <button class="filter" type="button" data-filter="Veterinária" aria-pressed="false"><span aria-hidden="true">🩺</span> Veterinário</button>
          <button class="filter" type="button" data-filter="Petshop" aria-pressed="false"><span aria-hidden="true">🛍️</span> Petshop</button>
          <button class="filter" type="button" data-filter="Banho" aria-pressed="false"><span aria-hidden="true">🫧</span> Banho & Tosa</button>
        </div>
      </section>

      <section class="map-section" aria-label="Mapa de serviços próximos">
        <div class="map-wrapper">
          <div class="map" id="map" role="region" aria-label="Mapa interativo do Google">
            <div class="map-loading" id="map-loading">
              <span class="loading-spinner" aria-hidden="true">🐾</span>
              <p>Carregando mapa...</p>
            </div>
          </div>
          <button class="locate-me" id="locate-me" type="button" aria-label="Centralizar na minha localização">⌖</button>
        </div>

        <div class="results-panel">
          <div class="panel-handle" aria-hidden="true"></div>
          <div class="results-heading">
            <div>
              <p><span id="result-count">12</span> lugares por perto</p>
              <span>Ordenados por distância</span>
            </div>
            <button type="button" id="view-toggle" aria-label="Alternar visualização"><span aria-hidden="true">☷</span> Lista</button>
          </div>

          <div class="cards" id="cards" aria-live="polite">
            <!-- Os cards dos 100 estabelecimentos serão renderizados dinamicamente pelo script.js -->
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a class="active" href="#" aria-current="page"><span aria-hidden="true">⌂</span>Início</a>
      <a href="#"><span aria-hidden="true">♡</span>Favoritos</a>
      <button class="nav-search" type="button" aria-label="Buscar serviços"><span aria-hidden="true">⌕</span></button>
      <a href="#"><span aria-hidden="true">▣</span>Agendas</a>
      <a href="#"><span aria-hidden="true">☺</span>Perfil</a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Base de Dados de Estabelecimentos (100 locais em Fortaleza) -->
  <script src="places.js"></script>
  <!-- Configuração do Google Maps (carregada do config.js se existir) -->
  <script src="config.js" onerror="window.GOOGLE_MAPS_CONFIG = window.GOOGLE_MAPS_CONFIG || null;"></script>
  <!-- Bootstrap Loader Oficial do Google Maps -->
  <script>
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.googleapis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: window.GOOGLE_MAPS_CONFIG ? window.GOOGLE_MAPS_CONFIG.apiKey : "",
      v: "weekly"
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
