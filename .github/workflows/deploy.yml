name: Deploy vetPerto no GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Gerar config.js dinamicamente a partir dos Secrets
        run: |
          cat <<EOF > config.js
          window.GOOGLE_MAPS_CONFIG = {
            apiKey: "${{ secrets.GOOGLE_MAPS_API_KEY }}",
            mapId: "${{ secrets.GOOGLE_MAPS_MAP_ID }}",
            defaultCenter: { lat: -3.7380, lng: -38.5020 },
            defaultZoom: 15
          };
          EOF

      - name: Configurar ambiente do GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefatos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
